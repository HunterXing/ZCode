# 自建桌面产物流水线：补齐官方未发布的平台。
#
# 上游 zai-org/ZCode 的 v3.14.3 release 只带
#   ZCode-3.14.3-mac-arm64.dmg
#   ZCode-3.14.3-win-x64.exe
# 缺 **macOS Intel (x64)** 与 **Linux**，本流水线专门补这两块缺口，
# 同时把 arm64 / win-x64 也重建一份，保证四个目标来自同一 commit、同一份源码。
#
# 为什么**不需要**免签名补丁（与 deepseek-harness 那套的关键差异）：
# 上游 electron-builder.config.js 已把签名/公证做成显式 opt-in：
#   const shouldEnableMacSigning = process.env.ZCODE_ENABLE_MAC_SIGN === "1" && Boolean(macSigningIdentity);
#   mac: { identity: shouldEnableMacSigning ? macSigningIdentity : null,
#          notarize: false,            // 硬编码关闭，不读任何 Apple 凭据
#          hardenedRuntime: shouldEnableMacSigning }
# Windows 签名同样受 ZCODE_ENABLE_WINDOWS_SIGN=1 门控。
# 于是「不设这两个变量」= 官方支持的免签名路径，不需要 git apply 任何补丁，
# 工作树永远干净，sync-upstream 的 rebase 也永远不会因为构建期改动而失败。
# 签名凭据一旦具备，配成 repository secrets 并打开对应开关即可切回官方签名流程。
#
# 免签名产物的使用（与官方未公证包一致）：
#   macOS  首次打开需 右键 → 打开 绕过 Gatekeeper
#   Windows SmartScreen 需 点「更多信息 → 仍要运行」
#   Linux   AppImage 直接 chmod +x 运行；deb/rpm/pacman 用对应包管理器安装

name: Build desktop artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

# 公开仓库的 GitHub 托管 runner 免费且不限量；改私有会开始计费，
# 且 macOS runner 按 10 倍分钟倍率计算。
permissions:
  contents: read

concurrency:
  group: desktop-build
  # true：新 push 立即掐掉上一次未完成的构建。
  # 宁可重跑，也不要产出一个缺平台/半成品的包。
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    # macos-15-intel 是原生 x64 runner（4 vCPU / 14GB）；macos-15 是原生 arm64（3 vCPU / 7GB）。
    # label 取值已对照 actions/runner-images 的 Available Images 核实。
    # 必须在原生 runner 上构建对应架构：electron-builder 的 mac 交叉编译不可靠，
    # 且 dmg 制作与 codesign 都是架构相关操作。
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-x64
            os: macos-15-intel
            platform: macOS
          - target: mac-arm64
            os: macos-15
            platform: macOS
          - target: win-x64
            os: windows-2022
            platform: Windows
          - target: linux-x64
            os: ubuntu-24.04
            platform: Linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # 注意：这里**不能**加 job 级 if 来筛选目标。GitHub 在矩阵展开**之前**求值
    # jobs.<id>.if，matrix 上下文尚不存在，会报 Unrecognized named-value: 'matrix'。
    # 需要按目标筛选只能在 step 级做（那里 matrix 可用）。

    steps:
      # Windows runner 的 Git for Windows 默认 core.autocrlf=true，会把工作区所有文本文件
      # 的 LF 转成 CRLF。上游 .gitattributes 只给 *.mjs / *.sh 强制了 eol=lf，
      # **.js 与 .min.js 没有规则**，于是 Windows 上 checkout 出来的 vendor 文件字节与仓库不同。
      # 而 packages/desktop/scripts/gen-ui-runtime-assets.mjs 会对这些文件做 sha256 校验
      # （"Gen UI vendor hash mismatch: floating-ui-core-1.7.3.min.js"），直接构建失败。
      #
      # 关键：这一段必须排在 actions/checkout **之前**。checkout 完成后文件已经落盘，
      # 再设 core.autocrlf 已经太晚（实测：在 checkout 之后关转换，校验依然失败）。
      # actions/checkout 内部调用的就是 PATH 里的 git，会读全局配置，所以 --global 有效。
      - name: 关闭行尾转换（仅 Windows，须在 checkout 之前）
        if: matrix.platform == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf
          echo "core.autocrlf=$(git config --global core.autocrlf)"
          echo "core.eol=$(git config --global core.eol)"

      - uses: actions/checkout@v5
        with:
          # 浅历史足够：构建只需要 HEAD。完整历史是 sync-upstream 的需求，不是构建的。
          # 注意：不需要 submodules —— 上游没有 .gitmodules，apps/zcode-cli 是普通目录。
          # （scripts/bootstrap.mjs 里的 `git submodule update` 对本仓库是空操作。）
          fetch-depth: 1

      # 仓库里如果混进了 Windows 禁止的文件名（< > : " | ? *、控制字符、尾部空格/点），
      # actions/checkout 会在 Windows runner 上直接报
      #   error: invalid path 'xxx'
      # 而这个失败发生在 checkout 阶段，日志里看不出是哪个文件，很难排查。
      # 真实踩坑记录：一个名为 `{s[conclusion]})` + 换行符的空文件被 git add -A 带进来，
      # 只有 win-x64 挂，另外三个平台全绿 —— 典型的「只炸一个平台」的隐蔽故障。
      # 这里在 checkout 之后立刻全量扫一遍，把故障变成一眼可见的报错。
      - name: 校验仓库路径可被 Windows 检出
        shell: bash
        run: |
          set -euo pipefail
          # 用管道而不是临时文件：Git Bash 会把 /tmp 映射到
          # %LOCALAPPDATA%\Temp，而 node.exe 收到字面量 /tmp/... 会解析成
          # 当前盘符下的 \tmp\（如 D:\tmp\），目录不存在直接 ENOENT。
          # 2026-10-11 实测踩过这个坑，守卫自己把 win-x64 弄挂了。
          git ls-tree -r -z --name-only HEAD | node -e '
            const chunks = [];
            process.stdin.on("data", (c) => chunks.push(c));
            process.stdin.on("end", () => {
              const raw = Buffer.concat(chunks).toString("utf8");
              const bad = [];
              for (const p of raw.split("\0")) {
                if (!p) continue;
                if (/[<>:"|?*\u0000-\u001f]/.test(p)) bad.push("含 Windows 禁用字符: " + JSON.stringify(p));
                else if (/[ .]$/.test(p)) bad.push("以空格或句点结尾: " + JSON.stringify(p));
              }
              if (bad.length) {
                console.error("::error::仓库含 Windows 无法检出的路径（会导致 win-x64 在 checkout 阶段失败）：");
                for (const b of bad.slice(0, 20)) console.error("  " + b);
                if (bad.length > 20) console.error(`  ...另有 ${bad.length - 20} 条`);
                process.exit(1);
              }
              console.log("路径校验通过：全部文件均可被 Windows 检出");
            });
          '

      - name: 校验 vendor 资源未被行尾转换污染
        if: matrix.platform == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # 直接跑上游自己的校验逻辑，而不是复刻一遍 sha256 比对：
          # 逻辑只有一份，脚本改了这里自动跟着改。
          node -e '
            import("./packages/desktop/scripts/gen-ui-runtime-assets.mjs")
              .then(async (m) => {
                const os = await import("node:os");
                const path = await import("node:path");
                const dest = path.join(os.tmpdir(), "gen-ui-verify");
                await m.copyGenUiRuntimeAssets(dest);
                console.log("vendor 资源校验通过，无 CRLF 污染");
              })
              .catch((e) => { console.error("::error::" + e.message); process.exit(1); });
          '

      # pnpm/action-setup 会读取根 package.json 的 packageManager 字段（pnpm@10.33.2），
      # 必须在 setup-node 之前：setup-node 的 cache: pnpm 依赖 PATH 里已有 pnpm。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # 上游 mise.toml 钉 node 24.14.0，package.json engines 要求 >=24.0.0
          node-version: '24.14.0'
          cache: pnpm

      - name: 记录 runner 规格与磁盘余量
        shell: bash
        run: |
          echo "### Runner 规格" >> "$GITHUB_STEP_SUMMARY"
          echo "- label: \`${{ matrix.os }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 目标: \`${{ matrix.target }}\`" >> "$GITHUB_STEP_SUMMARY"
          node -e 'const os=require("os");console.log(`- 环境: \`${process.version}\` / ${os.platform()} ${os.arch()} / ${os.cpus().length} vCPU / ${(os.totalmem()/2**30).toFixed(1)}GB RAM`)' >> "$GITHUB_STEP_SUMMARY"
          df -h . 2>/dev/null | tail -1 | awk '{print "- 工作盘可用: **"$4"** (总计 "$2")"}' >> "$GITHUB_STEP_SUMMARY" || echo "- 磁盘信息不可用" >> "$GITHUB_STEP_SUMMARY"

      - name: 安装依赖
        shell: bash
        run: |
          # 只跑 pnpm install，**不跑 pnpm bootstrap**：
          # bootstrap 会额外执行 build:bootstrap（全 workspace 构建 + prepare:desktop-runtime），
          # 而 bundle:desktop 自己就会跑 desktop 的 prepare:runtime-assets + build。
          # 这里再跑一遍纯属浪费 10+ 分钟 runner 时间。
          #
          # HUSKY=0：postinstall 里的 husky install 在无 git hooks 目录的 CI 上无意义且会告警。
          # 不加 --frozen-lockfile：上游 lockfile 偶有与 package.json 不同步的历史提交，
          # 锁死会让同步流水线因为一次上游提交直接失败。宁可用最新依赖重新解析。
          #
          # 重试 3 次：packages/desktop 的 postinstall 会跑 node-pty-rebuild.mjs，
          # 在非 Windows 平台**无条件**触发 electron-rebuild（decideNodePtyRebuild 对
          # win32 以外的平台直接返回 shouldRebuild: true），而 node-gyp 的
          # getNodeDir 阶段要联网下载 Electron headers。那是一次纯网络请求，
          # GitHub 托管 runner 偶发超时就会让整个 job 挂在「安装依赖」，
          # 与代码正确性无关（同一 commit 的 mac-arm64/linux 当轮就正常）。
          # 2026-10-11 实测：node-gyp 报 "most likely ... related to network connectivity"，
          # install.js:244 的 go() 抛出，随后 postinstall 以 255 退出。
          #
          # npm_config_disturl：node-gyp 只认这个变量来定位 Electron headers 源。
          # 已有的 ELECTRON_MIRROR 指的是 electron/electron 的**发行包**
          # （.../releases/download/），headers 在 electronjs.org/headers，
          # 两者不是同一条路径 —— 这正是必须显式设 disturl 的原因。
          for attempt in 1 2 3; do
            echo "::group::pnpm install (第 $attempt/3 次)"
            if HUSKY=0 \
               npm_config_disturl=https://github.com/electron/electron/releases/download/ \
               ELECTRON_MIRROR=https://github.com/electron/electron/releases/download/ \
               pnpm install --no-frozen-lockfile; then
              echo "::endgroup::"
              echo "依赖安装成功"
              break
            fi
            echo "::endgroup::"
            if [ "$attempt" = 3 ]; then
              echo "::error::依赖安装连续 3 次失败，放弃重试"
              exit 1
            fi
            # 退避后重试：网络类失败几乎都是瞬时的，立刻重试往往还是同一波抖动
            echo "::warning::第 $attempt 次安装失败，$((attempt * 20)) 秒后重试"
            sleep $((attempt * 20))
          done

      - name: 安装 Linux 打包依赖
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # 上游 linux target = ["AppImage", "deb", "rpm", "pacman"]，四个都要产出。
          # AppImage / deb 靠 electron-builder 内置 app-builder 处理，runner 自带工具即可。
          # rpm / pacman 走 fpm（app-builder-lib/out/targets/FpmTarget.js: executeFpm）：
          #   rpmbuild —— 该函数的报错提示明写 "Need executable 'rpmbuild' to convert dir to rpm"
          #   xz       —— 同处提示 "xz: not found"；rpm 与 pacman 共用 --*-compression，默认 xz
          #   bsdtar   —— **报错提示里没有它**，是 pacman target 生成 .mtree 时才炸的
          #               （LANG=C bsdtar -czf .MTREE --format=mtree ... → exit 127）
          #               上游 CI 是内网私有的，这个依赖不体现在任何公开文档或错误提示里。
          #               Debian/Ubuntu **没有叫 bsdtar 的包**，可执行文件由 libarchive-tools 提供
          #               （apt-cache search bsdtar 只列 libarchive-tools / mtree-netbsd / node-tar）。
          # 官方 runner 镜像不预装这三者，不显式装会在打包阶段才报错。
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm xz-utils libarchive-tools
          # 装完立刻断言：缺哪个就在依赖步骤直接失败，
          # 而不是拖 10 分钟后在打包阶段炸出一个难读的 exit 127。
          for bin in rpmbuild xz bsdtar; do
            command -v "$bin" >/dev/null || { echo "::error::$bin 仍不可用，对应打包目标会失败"; exit 1; }
          done
          echo "rpmbuild: $(rpmbuild --version 2>&1 | head -1)"
          echo "xz: $(xz --version 2>&1 | head -1)"
          echo "bsdtar: $(bsdtar --version 2>&1 | head -1)"

      - name: 校验目标架构
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            mac-x64)   EXPECT=darwin;  EXPECT_ARCH=x64  ;;
            mac-arm64) EXPECT=darwin;  EXPECT_ARCH=arm64 ;;
            win-x64)   EXPECT=win32;   EXPECT_ARCH=x64  ;;
            linux-x64) EXPECT=linux;   EXPECT_ARCH=x64  ;;
            *) echo "::error::未知目标"; exit 1 ;;
          esac
          ACTUAL=$(node -p 'process.platform')
          ACTUAL_ARCH=$(node -p 'process.arch')
          if [ "$ACTUAL" != "$EXPECT" ] || [ "$ACTUAL_ARCH" != "$EXPECT_ARCH" ]; then
            echo "::error::runner 架构不符：期望 $EXPECT/$EXPECT_ARCH，实际 $ACTUAL/$ACTUAL_ARCH"
            exit 1
          fi
          echo "runner 架构校验通过：$ACTUAL/$ACTUAL_ARCH"

      - name: 打包 ${{ matrix.target }}
        shell: bash
        env:
          # 生产身份：ZCODE_ENV=production 决定 productName=ZCode + appId=dev.zcode.app，
          # 并让 electron-builder 读取 config/provider/zcode-builtin.json（生产后端配置）。
          # 不设它会退化成 Preview 身份 + 测试后端配置，产出一个连不上正式服务的包。
          ZCODE_ENV: production
          # 显式关闭签名/公证（上游默认就是关的，这里写出来是为了让意图可读，
          # 且防止将来上游改变默认值时我们被静默带进需要 Apple 凭据的分支）。
          ZCODE_ENABLE_MAC_SIGN: '0'
          ZCODE_ENABLE_WINDOWS_SIGN: '0'
          # 打开应用内自动更新。默认 false 时 autoUpdater.enabled() 直接返回 false，
          # 应用内「检查更新」永远无效。开启后 electron-updater 去读
          # electron-builder.config.js 的 publish.url —— 已指向本仓库 GitHub Release。
          ZCODE_AUTO_UPDATE: '1'
          # 遥测端点保持为空：开源构建没有内部私有配置，显式写空字符串
          # 让 build-time-config 走「关闭」分支，而不是回落到默认值。
          ZCODE_ARMS_RUM_ENDPOINT: ''
          ZCODE_TELEMETRY_REPORT_ENDPOINT: ''
          # 上游 mise.toml 给的是 npmmirror（国内源）。GitHub 托管 runner 在美国，
          # 走国内源会绕远甚至超时，这里覆盖成官方源。
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: |
          set -euo pipefail
          # bundle.mjs 接位置参数 os arch（或 --os/--arch），内部依次跑
          #   prepare:runtime-assets → build → electron-builder → 产物校验 → 体积审计
          # electron-builder 不加 --publish：产物统一由后面的 upload-artifact 收走，
          # 避免每个 job 各自发一遍 Release。
          case "${{ matrix.target }}" in
            mac-x64)   pnpm run bundle:desktop -- mac x64   ;;
            mac-arm64) pnpm run bundle:desktop -- mac arm64 ;;
            win-x64)   pnpm run bundle:desktop -- win x64   ;;
            linux-x64) pnpm run bundle:desktop -- linux x64 ;;
            *) echo "::error::未知目标"; exit 1 ;;
          esac

      - name: 收集产物（macOS）
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # 产物名由 electron-builder.config.js 的 artifactName 决定：
          #   ${productName}-${version}-${platformName}-${arch}.${ext}
          # 例如 ZCode-3.15.1-mac-x64.dmg / .zip
          mkdir -p out
          shopt -s nullglob
          DMG=(packages/desktop/dist/*-mac-*.dmg)
          ZIP=(packages/desktop/dist/*-mac-*.zip)
          if [ ${#DMG[@]} -eq 0 ]; then
            echo "::error::未找到 mac DMG 产物"; ls -la packages/desktop/dist/ || true; exit 1
          fi
          echo "DMG 产物："
          for f in "${DMG[@]}"; do printf '  %s (%s)\n' "$f" "$(du -sh "$f" | cut -f1)"; done
          # zip 是 electron-updater 的差分更新格式（blockmap 已在其中），
          # 一并发布，将来开 OTA 时可直接用。
          if [ ${#ZIP[@]} -gt 0 ]; then
            echo "ZIP 产物："
            for f in "${ZIP[@]}"; do printf '  %s (%s)\n' "$f" "$(du -sh "$f" | cut -f1)"; done
          fi
          # 断言产物架构与矩阵目标一致。
          # mac 的 ${arch} 段在 electron-builder 里展开为 x64 / arm64；
          # 装错架构的 .dmg 在用户机器上「双击没反应」或提示无法打开，最难事后排查。
          # 用显式 case 分派，不在 Actions 表达式里做三元：
          # 后者依赖「真值非假」的隐式规则，可读性差且容易在后续改动中写错。
          case "${{ matrix.target }}" in
            mac-x64)   EXPECT_ARCH_NAME=x64  ;;
            mac-arm64) EXPECT_ARCH_NAME=arm64 ;;
            *) echo "::error::未知目标"; exit 1 ;;
          esac
          for f in "${DMG[@]}" ${ZIP[@]+"${ZIP[@]}"}; do
            case "$f" in
              *-mac-"$EXPECT_ARCH_NAME".dmg|*-mac-"$EXPECT_ARCH_NAME".zip) ;;
              *) echo "::error::产物架构不符（期望 -mac-$EXPECT_ARCH_NAME.*）：$f"; exit 1 ;;
            esac
          done
          cp "${DMG[@]}" out/
          [ ${#ZIP[@]} -eq 0 ] || cp "${ZIP[@]}" out/
          # blockmap 是 electron-updater 差分更新的必需文件，与 zip 同名放在旁边。
          # glob 模式 *.zip 匹配不到 .zip.blockmap，必须单独收 —— 漏了它
          # 应用内更新会静默退化成整包下载（deepseek-harness 那侧还要自己生成，
          # 这里 electron-builder 已经产出了，只是没收）。
          shopt -s nullglob
          BMAP=(packages/desktop/dist/*-mac-*.zip.blockmap)
          if [ ${#BMAP[@]} -gt 0 ]; then
            echo "blockmap："
            for f in "${BMAP[@]}"; do printf '  %s (%s)\n' "$f" "$(du -sh "$f" | cut -f1)"; done
            cp "${BMAP[@]}" out/
          else
            echo "::warning::未找到 .zip.blockmap，差分更新会退化为整包下载"
          fi
          ls -la out/

      # electron-updater 的 MacUpdater 只有拿到 <artifact>.blockmap 才会走差分下载，
      # 否则整包重下。electron-builder 自己产的 zip 已带 blockmap，这里做断言而不是重算，
      # 避免和 electron-builder 的分块参数不一致。
      - name: 生成 electron-updater 清单（macOS）
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ZIP=(out/*-mac-*.zip)
          if [ ${#ZIP[@]} -eq 0 ]; then
            echo "::error::没有 macOS zip，无法作为 OTA 更新源（electron-updater 只认 zip）"
            exit 1
          fi
          TARGET_ZIP="${ZIP[0]}"
          # electron-updater 按 <files[].url> 去拼 <url>.blockmap，文件名必须对得上。
          test -f "${TARGET_ZIP}.blockmap" \
            || { echo "::error::缺少 ${TARGET_ZIP}.blockmap，差分更新会退化成整包下载"; exit 1; }
          # 清单名必须是 electron-updater 默认的 latest-mac.yml；
          # app-update.yml 里的 channel: latest 决定了客户端来取这个文件名。
          VER=$(node -p "require('./packages/desktop/package.json').version")
          NAME=$(basename "$TARGET_ZIP")
          FEED="https://github.com/HunterXing/ZCode/releases/download/ci-latest/"
          SHA=$(openssl dgst -sha512 -binary "$TARGET_ZIP" | openssl base64 -A)
          SIZE=$(stat -f '%z' "$TARGET_ZIP")
          cat > out/latest-mac.yml <<YML
          version: $VER
          files:
            - url: ${FEED}$NAME
              sha512: $SHA
              size: $SIZE
          path: $NAME
          sha512: $SHA
          releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'
          YML
          echo "--- 生成的 latest-mac.yml ---"
          sed 's/^/  /' out/latest-mac.yml
          # app-update.yml 是 electron-updater 运行时判断 enabled() 的依据，
          # 它的 url 必须是本仓库 Release 而不是构建期的占位值。
          APP_UPDATE="packages/desktop/dist/mac*/ZCode.app/Contents/Resources/app-update.yml"
          shopt -s nullglob
          AU=($APP_UPDATE)
          if [ ${#AU[@]} -eq 0 ]; then
            echo "  (app.asar 打包模式，app-update.yml 不在 dist 下，跳过)"
          else
            echo "--- app-update.yml ---"; sed 's/^/  /' "${AU[0]}"
            grep -q 'HunterXing/ZCode/releases' "${AU[0]}" \
              || { echo "::error::app-update.yml 未指向本仓库 Release，OTA 会指向错误源"; exit 1; }
          fi

      - name: 收集产物（Windows）
        if: matrix.platform == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          # 产物名形如 ZCode-3.15.1-win-x64.exe
          EXE=(packages/desktop/dist/*-win-*.exe)
          if [ ${#EXE[@]} -eq 0 ]; then
            echo "::error::未找到 Windows EXE 产物"; ls -la packages/desktop/dist/ || true; exit 1
          fi
          # 顺带断言架构：产物名里的 arch 段必须与矩阵目标一致。
          # NSIS 装错架构的包在用户机器上会静默装不上（"应用无法在这台电脑运行"），
          # 属于最难在事后发现的一类问题，必须在发布前拦住。
          for f in "${EXE[@]}"; do
            case "$f" in
              *-win-x64.exe) ;;
              *) echo "::error::产物架构不符（期望 -win-x64.exe）：$f"; exit 1 ;;
            esac
          done
          cp "${EXE[@]}" out/
          ls -la out/

      - name: 生成 electron-updater 清单（Windows）
        if: matrix.platform == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          EXE=(out/*-win-*.exe)
          [ ${#EXE[@]} -eq 0 ] && { echo "::error::没有 Windows exe"; exit 1; }
          TARGET_EXE="${EXE[0]}"
          VER=$(node -p "require('./packages/desktop/package.json').version")
          NAME=$(basename "$TARGET_EXE")
          FEED="https://github.com/HunterXing/ZCode/releases/download/ci-latest/"
          SHA=$(openssl dgst -sha512 -binary "$TARGET_EXE" | openssl base64 -A)
          SIZE=$(stat -c '%s' "$TARGET_EXE" 2>/dev/null || wc -c < "$TARGET_EXE")
          cat > out/latest.yml <<YML
          version: $VER
          files:
            - url: ${FEED}$NAME
              sha512: $SHA
              size: $SIZE
          path: $NAME
          sha512: $SHA
          releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'
          YML
          echo "--- 生成的 latest.yml ---"; sed 's/^/  /' out/latest.yml

      - name: 收集产物（Linux）
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          # 上游 linux target = ["AppImage", "deb", "rpm", "pacman"]
          # 一次构建出四种包，全部收走（总共约 200MB，一次性成本可接受）。
          FOUND=0
          for pattern in '*-linux-*.AppImage' '*-linux-*.deb' '*-linux-*.rpm' '*-linux-*.pkg.tar.zst'; do
            MATCHES=(packages/desktop/dist/$pattern)
            if [ ${#MATCHES[@]} -gt 0 ]; then
              FOUND=$((FOUND + ${#MATCHES[@]}))
              printf '  %s (%s)\n' "${MATCHES[@]}" "$(du -sh "${MATCHES[@]}" | cut -f1 | paste -sd' ')"
              cp "${MATCHES[@]}" out/
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "::error::未找到任何 Linux 产物"; ls -la packages/desktop/dist/ || true; exit 1
          fi
          echo "共收集 $FOUND 个 Linux 包"
          ls -la out/

      - name: 产物版本自检
        shell: bash
        run: |
          set -euo pipefail
          # extraMetadata.version 来自仓库 package.json 的 version，
          # 发布出去的产物必须带着与源码一致的版本，否则客户端永远提示「有新版」。
          EXPECT=$(node -p "require('./package.json').version")
          echo "仓库声明版本: $EXPECT"
          ls -1 out/
          # 文件名里必须含版本号。electron-updater 靠把 URL 里的新版本号替换成旧版本号
          # 来定位上一版的 blockmap，名字里没有版本号差分就退化成全量下载。
          # 例外：electron-updater 的清单文件（latest*.yml）按约定不带版本号，
          # 它们是固定名字的索引，内容里的 files[].url 才是带版本号的产物地址。
          BAD=$(ls -1 out/ | grep -v '^latest.*\.yml$' | grep -v "$EXPECT" || true)
          if [ -n "$BAD" ]; then
            echo "::error::以下产物文件名不含版本号 $EXPECT，发布后差分更新会退化为全量下载："
            echo "$BAD"
            exit 1
          fi
          echo "产物版本自检通过"

      - uses: actions/upload-artifact@v4
        with:
          name: zcode-${{ matrix.target }}
          path: out/
          retention-days: 30
          if-no-files-found: error

      - name: 构建后磁盘用量
        if: always()
        shell: bash
        run: df -h . 2>/dev/null | tail -1 | awk '{print "工作盘已用 "$3" / "$2"  可用 "$4}' | tee -a "$GITHUB_STEP_SUMMARY" || echo "磁盘信息不可用" | tee -a "$GITHUB_STEP_SUMMARY"

  # 产物默认只落在 Actions artifact（30 天过期、藏在 run 页面里），
  # 这里再发一份到 Releases：有稳定 URL、可长期保留、其他机器/脚本能直接引用。
  publish-release:
    name: 发布四个平台
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 下载四个平台的产物
        uses: actions/download-artifact@v4
        with:
          pattern: zcode-*
          merge-multiple: true
          path: dist

      - name: 读取构建版本与待发布文件
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # 版本从产物文件名反推，而不是从仓库 package.json：
          # 后者只是 productVersion，发布出去的 Release 标题会长期显示一个比产物旧的版本。
          # 排除 electron-updater 清单（latest*.yml），它们是固定名索引、不带版本号，
          # `head -1` 命中它们会让下面的 sed 解析失败。
          NAME=$(ls -1 dist/ | grep -v '^latest.*\.yml$' | head -1)
          if [ -z "$NAME" ]; then
            echo "::error::没有下载到任何产物"; exit 1
          fi
          VER=$(echo "$NAME" | sed -n 's/^ZCode-\([0-9][^-]*\)-.*/\1/p')
          if [ -z "$VER" ]; then
            echo "::error::无法从产物文件名解析版本：$NAME"; exit 1
          fi
          echo "构建版本: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "待发布文件："; ls -la dist/

      - name: 创建 / 覆盖 Release ci-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: ZCode ${{ steps.meta.outputs.version }} (四平台自建)
          body: |
            由 `build-desktop.yml` 自动构建并覆盖发布，源码同步自 [zai-org/ZCode](https://github.com/zai-org/ZCode)。

            - 构建 commit：`${{ github.sha }}`
            - 运行时版本：`${{ steps.meta.outputs.version }}`
            - 触发方式：每天定时同步上游后自动重建

            **补齐了官方未发布的平台**：官方 release 只有 `mac-arm64.dmg` 与 `win-x64.exe`，
            本构建额外提供 **macOS Intel (x64)** 与 **Linux**（AppImage / deb / rpm / pacman）。

            **支持应用内自动更新**：更新源指向本 Release（tag 固定 `ci-latest`，每次构建覆盖），
            应用内「检查更新」会比对 `latest-mac.yml` / `latest.yml` 拉取新版。
            首次安装仍需绕过 Gatekeeper 一次，之后的更新不再受此限制。

            **产物未签名、未公证。**
            - macOS：首次打开需 右键 → 打开 绕过 Gatekeeper。
            - Windows：SmartScreen 弹窗点「更多信息 → 仍要运行」。
            - Linux：AppImage `chmod +x` 后直接运行；deb/rpm/pacman 用对应包管理器安装。
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
